name: opengym
services:
  api:
    image: opengym-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      TRUST_PROXY: "1"
      DEVICE_TOKENS: "1"
    volumes:
      - opengym-data:/data
  web:
    image: opengym-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        WEB_DIST: packages/web/dist
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      BACKEND: api
      PORT: ${PORT:-3000}
      RESOLVER: 127.0.0.11
      CF_CONNECTING_IP: ""
      BASE_PATH: ${BASE_PATH:-}
      MEDIA_UPLOAD_MAX: 48m
volumes:
  opengym-data:
